[package]
name = "ecnu-connect"
version = "0.1.0"
edition = "2024"
authors = ["wpcRaskolnikov <22pcwang@stu.ecnu.edu.cn>"]
repository = "https://github.com/wpcRaskolnikov/ecnu-connect.git"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tungstenite = "0.30.0"
url = "2.5.9"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
